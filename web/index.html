<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
   Deploy Command: firebase deploy --only hosting
  --> 
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Multi-device responsive task manager with hierarchy, real-time collaboration, and Kanban workflows.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Colliq-Team Task Manager">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Colliq-Team - Modern Task Management & Collaboration</title>
  <link rel="manifest" href="manifest.json">
  
  
  <!-- Google Sign-In Web Client ID -->
  <meta name="google-signin-client_id" content="959053640502-2t7vfpl3fsfq3g3hqpj9n7tltplal3d2.apps.googleusercontent.com">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <style id="splash-screen-style">
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #121212;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #121212;
      z-index: 999999;
      transition: opacity 0.4s ease-out;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .splash-title {
      color: #FFFFFF;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .splash-subtitle {
      color: #AFAFAF;
      font-size: 14px;
      margin-top: -12px;
    }

    .splash-spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(134, 135, 231, 0.2);
      border-top-color: #8687E7;
      border-radius: 50%;
      animation: splash-spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      const splash = document.getElementById("splash");
      if (splash) {
        splash.style.opacity = "0";
        splash.style.pointerEvents = "none";
        setTimeout(() => {
          splash.remove();
          document.body.style.backgroundColor = "transparent";
        }, 400);
      }
    }

    // Auto-remove splash when flutter-view appears
    window.addEventListener("DOMContentLoaded", () => {
      const observer = new MutationObserver(() => {
        if (document.querySelector("flutter-view")) {
          setTimeout(removeSplashFromWeb, 200);
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true });

      // Fallback safeguard: remove splash after 5s max
      setTimeout(removeSplashFromWeb, 5000);
    });
  </script>
</head>
<body>
  <div id="splash">
    <div class="splash-container">
      <div class="splash-spinner"></div>
      <div class="splash-title">Colliq-Team</div>
      <div class="splash-subtitle">Loading your workspace...</div>
    </div>
  </div>
  
  <script>
    const script = document.createElement("script");
    script.src = "flutter_bootstrap.js?v=" + new Date().getTime();
    script.async = true;
    document.body.appendChild(script);
  </script>
</body></html>
